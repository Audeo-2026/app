[versions]
agp = "8.13.2"
kotlin = "2.3.20"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.13.0"
composeBom = "2025.10.01"
junit = "4.13.2"

# Pleos Connect SDK: https://nexus-playground.pleos.ai/repository/maven-releases/ai/pleos/playground/
pleosVehicle = "2.3.2"
pleosNaviHelper = "3.0.5"
pleosTextToSpeech = "3.3.1"
pleosSpeechToText = "3.3.1"
pleosFusedLocation = "1.1.3"

# Audeo 서버 실시간 연결(WebSocket)과 통화 음성(WebRTC)
okhttp = "4.12.0"
webrtc = "1.3.10"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "pleosVehicle" }
pleos-navi-helper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "pleosNaviHelper" }
pleos-text-to-speech = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "pleosTextToSpeech" }
pleos-speech-to-text = { group = "ai.pleos.playground", name = "SpeechToText", version.ref = "pleosSpeechToText" }
pleos-fused-location = { group = "ai.pleos.playground", name = "FusedLocation", version.ref = "pleosFusedLocation" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
webrtc = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "webrtc" }

[bundles]
pleos-sdk = [
    "pleos-vehicle",
    "pleos-navi-helper",
    "pleos-text-to-speech",
    "pleos-speech-to-text",
    "pleos-fused-location",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
