<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audeo 탑승자 테스트</title>
<style>
  :root { --ground:#f2f3f5; --surface:#fff; --surface2:#e7e9ed; --line:#cdd2d9; --dialog:#8d95a0; --ink:#0e1013; --muted:#525a65; --brand:#2347f5; --brand-ink:#1f3fd8; --caution:#8a5600; --danger:#b8261a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.45 "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { max-width:420px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:28px; color:var(--brand-ink); }
  .card { background:var(--surface); border:1px solid var(--dialog); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:0 8px 24px rgba(14,16,19,.12); }
  .kicker { font-size:13px; font-weight:600; color:var(--brand-ink); }
  .title { font-size:21px; font-weight:600; }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:14px; border-top:1px solid var(--line); padding-top:8px; }
  .row:first-of-type { border-top:0; }
  .row span:first-child { color:var(--muted); }
  .ok { color:var(--brand-ink); font-weight:600; }
  .bad { color:var(--danger); font-weight:600; }
  .voice { background:var(--surface2); border-radius:12px; padding:12px; font-weight:600; }
  .voice small { display:block; font-weight:500; color:var(--brand-ink); font-size:13px; }
  button { height:52px; border:0; border-radius:12px; padding:0 16px; font:600 17px system-ui; background:var(--surface2); color:var(--ink); }
  button.primary { background:var(--brand); color:#fff; }
  button.danger { background:var(--danger); color:#fff; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  #log { font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--muted); white-space:pre-wrap; max-height:220px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>Audeo 탑승자</h1>
  <div class="card">
    <div class="kicker">통화 시험용 페이지</div>
    <div class="title" id="headline">연결하는 중</div>
    <div class="row"><span>서버 실시간 연결</span><b id="ws">-</b></div>
    <div class="row"><span>통화</span><b id="call">-</b></div>
    <div class="row"><span>통화 음성(WebRTC)</span><b id="ice">-</b></div>
    <div class="voice" id="speaking" hidden><small>내가 말하는 중</small><span id="line"></span></div>
    <div class="voice" id="say" hidden><small>Audeo</small><span id="sayText"></span></div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="card"><div class="kicker">기록</div><div id="log"></div></div>
  <audio id="remote" autoplay playsinline></audio>
</main>
<script>
// 이 페이지는 차량 앱 통화를 시험하는 탑승자 역할입니다.
// - 전화가 오면 AI 분석에 동의하고 받습니다(?auto=1이면 자동, 아니면 버튼).
// - 통화 음성은 WebRTC로 차와 직접 잇고, 신호(offer/answer/ice)는 Audeo 서버로 주고받습니다.
// - 음성이 이어지면 미리 만든 한국어 대사(audio/lineN.wav)를 통화 음성으로 내보냅니다. 차가 이걸 받아씁니다.
//   ?mic=1 이면 대사 대신 이 컴퓨터 마이크(내 목소리)를 통화로 보냅니다. 이어폰을 끼세요.
// - ?record=1 이면 통화 음성(내가 보낸 소리 + 차에서 온 소리)을 녹음해서 통화가 끝나면 서버(/upload)에 올립니다.
const params = new URLSearchParams(location.search);
const auto = params.get('auto') === '1';
const useMic = params.get('mic') === '1';
const record = params.get('record') === '1';
const $ = (id) => document.getElementById(id);
const log = (m) => { const t = new Date().toTimeString().slice(0, 8); $('log').textContent = `${t}  ${m}\n` + $('log').textContent; console.log(m); };
const api = async (method, path, body) => {
  const r = await fetch('/api/' + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  if (!r.ok) throw new Error(`${r.status} ${text.slice(0, 160)}`);
  return text ? JSON.parse(text) : {};
};

let cfg, me, last = 0, call = null, pc = null, ctx = null, dest = null, remoteSet = false, pendingIce = [], scriptPlayed = false;
// 연결은 한 번만 만들고(peerReady), 받은 신호는 도착 순서대로 하나씩 처리합니다(signalChain).
// offer·ice가 연결 준비보다 먼저 와도 연결이 둘 생기거나 순서가 꼬이지 않게 하려는 것입니다.
let peerReady = null, signalChain = Promise.resolve();
let micStream = null, mix = null, recorder = null, chunks = [], recStart = 0;
const ensurePeer = (caller) => (peerReady ??= startPeer(caller));

function setState(id, text, good) { $(id).textContent = text; $(id).className = good === undefined ? '' : (good ? 'ok' : 'bad'); }
function headline(t) { $('headline').textContent = t; }
function actions(list) {
  $('actions').innerHTML = '';
  list.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = fn; $('actions').appendChild(b); });
}

async function start() {
  cfg = await (await fetch('/config.json?scenario=' + (params.get('scenario') || 'cold'))).json();
  me = await api('GET', 'devices/me');
  last = (await api('GET', 'events?after_seq=0&wait_s=0')).last_seq || 0;
  headline(`${me.user.name} · 전화를 기다리는 중`);
  connect();
}

function connect() {
  const ws = new WebSocket(`${cfg.ws}?token=${cfg.token}&after_seq=${last}`);
  ws.onopen = () => { setState('ws', '연결됨', true); setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ type: 'ping' })), 20000); };
  ws.onclose = () => { setState('ws', '끊김 · 다시 연결', false); setTimeout(connect, 2000); };
  ws.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.seq && e.seq <= last) return; // 접속하며 다시 온 지난 이벤트
    if (e.seq) last = e.seq;
    onEvent(e);
  };
}

function onEvent(e) {
  const d = e.data || {};
  switch (e.type) {
    case 'call.incoming':
      call = d;
      setState('call', `${d.from?.call_name || '상대'} 전화 옴`);
      headline(`${d.from?.call_name || '상대'} 전화예요`);
      actions([['동의하고 받기', 'primary', () => answer(true)], ['그냥 받기', '', () => answer(false)], ['거절', 'danger', reject]]);
      if (auto) setTimeout(() => answer(true), 2500);
      break;
    case 'call.state': onCallState(d); break;
    case 'rtc.signal':
      if (call && d.call_id === call.id) signalChain = signalChain.then(() => onSignal(d.kind, d.payload || {}));
      break;
    case 'agent.say': if (!d.role || d.role === 'passenger') { $('say').hidden = false; $('sayText').textContent = `“${d.text}”`; } break;
    case 'proposal.created': if ((d.audience || []).includes('passenger')) log(`제안: ${d.kind} · ${d.title}`); break;
    default: if (e.type) log(e.type);
  }
}

async function answer(consent) {
  if (!call) return;
  actions([]);
  try { onCallState(await api('POST', `calls/${call.id}/answer`, { analysis_consent: consent })); } catch (err) { log('받기 실패: ' + err.message); }
}
async function reject() { if (call) onCallState(await api('POST', `calls/${call.id}/reject`)); }
async function hangup() { if (call) onCallState(await api('POST', `calls/${call.id}/end`)); }

function onCallState(d) {
  if (call && d.id !== call.id && d.status === 'ended') return;
  const prev = call?.status;
  call = d;
  const peer = d.caller?.user_id === me.user.user_id ? d.callee : d.caller;
  if (d.status === 'active') {
    setState('call', `${peer?.call_name || '상대'}와 통화 중${d.analysis_on ? ' · AI 분석 동의' : ''}`, true);
    headline('통화 중');
    actions([['통화 끊기', 'danger', hangup]]);
    if (prev !== 'active') ensurePeer(d.caller?.user_id === me.user.user_id);
  } else if (d.status === 'ringing') {
    setState('call', '연결 중');
  } else {
    setState('call', `끝남 (${d.status})`);
    headline(`${me.user.name} · 전화를 기다리는 중`);
    actions([]);
    closePeer();
  }
}

async function startPeer(caller) {
  const ice = (await api('GET', 'rtc/config')).ice_servers || [];
  pc = new RTCPeerConnection({ iceServers: ice });
  ctx = ctx || new AudioContext({ sampleRate: 48000 });
  await ctx.resume();
  if (record) mix = ctx.createMediaStreamDestination();
  if (useMic) {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    micStream.getAudioTracks().forEach((t) => pc.addTrack(t, micStream));
    if (mix) ctx.createMediaStreamSource(micStream).connect(mix);
    log('마이크로 말해요(이어폰을 끼세요)');
  } else {
    dest = ctx.createMediaStreamDestination();
    dest.stream.getAudioTracks().forEach((t) => pc.addTrack(t, dest.stream));
  }
  pc.onicecandidate = (ev) => ev.candidate && signal('ice', { candidate: ev.candidate.candidate, sdpMid: ev.candidate.sdpMid, sdpMLineIndex: ev.candidate.sdpMLineIndex });
  pc.ontrack = (ev) => {
    const remote = ev.streams[0] || new MediaStream([ev.track]);
    $('remote').srcObject = remote;
    $('remote').play().catch(() => {});
    if (mix) ctx.createMediaStreamSource(remote).connect(mix);
    log('차 목소리 연결');
  };
  pc.onconnectionstatechange = () => {
    const s = pc?.connectionState;
    setState('ice', s, s === 'connected');
    log('음성 연결: ' + s);
    if (s === 'connected' && mix && !recorder) startRecording();
    if (s === 'connected' && !useMic && !scriptPlayed && call?.analysis_on) { scriptPlayed = true; setTimeout(playScript, 1500); }
  };
  setState('ice', '연결 준비');
  if (caller) {
    const offer = await pc.createOffer({ offerToReceiveAudio: true });
    await pc.setLocalDescription(offer);
    signal('offer', { type: 'offer', sdp: offer.sdp });
  }
}

async function onSignal(kind, p) {
  await ensurePeer(false);
  try {
    if (kind === 'offer') {
      await pc.setRemoteDescription({ type: 'offer', sdp: p.sdp });
      remoteSet = true; flushIce();
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      signal('answer', { type: 'answer', sdp: ans.sdp });
    } else if (kind === 'answer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: p.sdp });
      remoteSet = true; flushIce();
    } else if (kind === 'ice' && p.candidate) {
      const c = { candidate: p.candidate, sdpMid: p.sdpMid ?? '0', sdpMLineIndex: p.sdpMLineIndex ?? 0 };
      remoteSet ? await pc.addIceCandidate(c) : pendingIce.push(c);
    }
  } catch (err) { log(`신호 처리 실패(${kind}): ${err.message}`); }
}
function flushIce() { pendingIce.forEach((c) => pc.addIceCandidate(c)); pendingIce = []; }
function signal(kind, payload) { api('POST', `calls/${call.id}/signal`, { kind, payload }).catch((e) => log(`신호 전송 실패(${kind}): ${e.message}`)); }

function startRecording() {
  chunks = [];
  recorder = new MediaRecorder(mix.stream, { mimeType: 'audio/webm;codecs=opus' });
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const r = await fetch(`/upload?t0=${recStart}`, { method: 'POST', body: blob });
    log(`통화 녹음 저장: ${(await r.json()).file} (${Math.round(blob.size / 1024)}KB)`);
  };
  recStart = Date.now();
  recorder.start(1000);
  log('통화 녹음 시작');
}

function closePeer() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  recorder = null; mix = null;
  micStream?.getTracks().forEach((t) => t.stop()); micStream = null;
  if (pc) { pc.close(); pc = null; }
  peerReady = null; signalChain = Promise.resolve();
  remoteSet = false; pendingIce = []; scriptPlayed = false;
  setState('ice', '-');
  $('speaking').hidden = true;
}

// 미리 만든 대사를 차례로 통화 음성에 흘려보냅니다(차에서는 이 목소리를 받아써요).
async function playScript() {
  for (let i = 1; i <= cfg.lines; i++) {
    if (!pc || pc.connectionState !== 'connected') return;
    const buf = await ctx.decodeAudioData(await (await fetch(`audio/${cfg.scenario}/line${i}.wav`)).arrayBuffer());
    $('speaking').hidden = false;
    $('line').textContent = `“${cfg.texts[i - 1]}”`;
    log(`말하기 ${i}: ${cfg.texts[i - 1]}`);
    await new Promise((res) => {
      const s = ctx.createBufferSource();
      s.buffer = buf;
      s.connect(dest);
      if (mix) s.connect(mix);
      s.onended = res;
      s.start();
    });
    await new Promise((res) => setTimeout(res, 2500));
  }
  $('speaking').hidden = true;
  log('대사를 모두 말했어요');
}

start().catch((e) => { headline('시작하지 못했어요'); log(e.message); });
</script>
</body>
</html>
